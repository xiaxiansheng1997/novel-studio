<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web2API 对话</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --fg:#e6e8eb; --muted:#8b95a7; --accent:#4c8dff; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
    header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:15px; margin:0; font-weight:600; }
    select, input, button { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; }
    button { cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
    .msg { max-width:860px; margin:0 auto; width:100%; }
    .msg .role { font-size:12px; color:var(--muted); margin-bottom:4px; }
    .msg .body { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 14px; white-space:pre-wrap; word-break:break-word; }
    .msg.user .body { background:#1b2740; border-color:#2b3a5c; }
    .reasoning { color:var(--muted); font-size:13px; border-left:2px solid var(--border); padding:4px 10px; margin-bottom:8px; white-space:pre-wrap; }
    footer { border-top:1px solid var(--border); padding:12px 16px; }
    .composer { max-width:860px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
    textarea { flex:1; resize:vertical; min-height:44px; max-height:200px; background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font:inherit; }
    .top-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
    a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <h1>Web2API 对话</h1>
    <select id="model"></select>
    <input id="apiKey" type="password" placeholder="API Key（若服务端未设可留空）" style="width:220px" />
    <div class="top-right">
      <button id="clear">清空</button>
      <a href="/ui/admin.html"><button>管理</button></a>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </div>
  </footer>

  <script>
    const els = {
      model: document.getElementById('model'),
      apiKey: document.getElementById('apiKey'),
      chat: document.getElementById('chat'),
      input: document.getElementById('input'),
      send: document.getElementById('send'),
      clear: document.getElementById('clear'),
    };
    let history = [];

    els.apiKey.value = localStorage.getItem('w2a_apikey') || '';
    els.apiKey.addEventListener('change', () => localStorage.setItem('w2a_apikey', els.apiKey.value));

    async function loadModels() {
      try {
        const r = await fetch('/v1/models', { headers: authHeaders() });
        const j = await r.json();
        const models = j.data || [];
        els.model.innerHTML = models.map(m => `<option value="${m.id}">${m.id} (${m.owned_by})</option>`).join('');
        // 从内嵌浏览器登录页跳转过来时，预选该 provider 的模型
        const want = new URLSearchParams(location.search).get('provider');
        if (want) {
          const hit = models.find(m => m.id === want || m.id.startsWith(want + '-'));
          if (hit) els.model.value = hit.id;
        }
      } catch (e) { console.error(e); }
    }
    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const k = els.apiKey.value.trim();
      if (k) h['Authorization'] = 'Bearer ' + k;
      return h;
    }

    function addBubble(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      wrap.innerHTML = `<div class="role">${role === 'user' ? '你' : '助手'}</div>` +
        `<div class="reasoning" style="display:none"></div>` +
        `<div class="body"></div>`;
      wrap.querySelector('.body').textContent = text || '';
      els.chat.appendChild(wrap);
      els.chat.scrollTop = els.chat.scrollHeight;
      return wrap;
    }

    els.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    els.send.addEventListener('click', send);
    els.clear.addEventListener('click', () => { history = []; els.chat.innerHTML = ''; });

    async function send() {
      const text = els.input.value.trim();
      if (!text) return;
      els.input.value = '';
      addBubble('user', text);
      history.push({ role: 'user', content: text });

      const bubble = addBubble('assistant', '');
      const bodyEl = bubble.querySelector('.body');
      const reasonEl = bubble.querySelector('.reasoning');
      let acc = '', reasonAcc = '';
      bodyEl.textContent = '思考中…';
      bodyEl.style.color = 'var(--muted)';

      els.send.disabled = true;
      try {
        const resp = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ model: els.model.value, messages: history, stream: true }),
        });
        if (!resp.ok) {
          const e = await resp.json().catch(() => ({}));
          throw new Error((e.error && e.error.message) || ('HTTP ' + resp.status));
        }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (!line.startsWith('data:')) continue;
            const data = line.slice(5).trim();
            if (data === '[DONE]') continue;
            let obj; try { obj = JSON.parse(data); } catch (_) { continue; }
            if (obj.error) { throw new Error(obj.error.message); }
            const d = (obj.choices && obj.choices[0] && obj.choices[0].delta) || {};
            if (d.reasoning_content) { reasonAcc += d.reasoning_content; reasonEl.style.display='block'; reasonEl.textContent='思考：'+reasonAcc; }
            if (d.content) { acc += d.content; bodyEl.textContent = acc; bodyEl.style.color = ''; }
            els.chat.scrollTop = els.chat.scrollHeight;
          }
        }
        history.push({ role: 'assistant', content: acc });
        if (!acc && !reasonAcc) {
          bodyEl.textContent = '⚠ 未收到回复（可能超时），请重试';
          bodyEl.style.color = '#e67e73';
        }
      } catch (e) {
        bodyEl.textContent = '⚠ ' + e.message;
      } finally {
        els.send.disabled = false;
        els.input.focus();
      }
    }

    loadModels();
  </script>
</body>
</html>
