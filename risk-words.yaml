# 公众号风险词（本地词表）
#
# 用途：发布前检查（app/studio/publish.py）扫一遍，命中只提示「建议改写」，不拦截、不扣分。
# 维护原则：
#   1. 只收「写了容易被判违规/限流」的词，不收日常词——误报多了，作者会把整组提示关掉；
#   2. 词越长越准：「最好」会误伤「最好的办法」，「稳赚不赔」不会；
#   3. 平台规则会变，这份表按需自己加，改完不用重启（按 mtime 重新读）。
#
# 没有内置时政类：那类词表变化快、误报代价高，宁可留给作者按自己的选题补充。
# 要加就照下面加一个分类，或者直接往「自定义」里写。

